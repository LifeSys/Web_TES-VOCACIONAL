<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · Bitácora Vocacional</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700;900&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;">
        <svg viewBox="0 0 104 104" style="width:30px;height:30px;color:var(--accent);"><circle cx="52" cy="52" r="46" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="52" cy="52" r="4" fill="currentColor"/></svg>
        <span class="brand-name">Bitácora <span>Vocacional</span></span>
      </a>
    </div>
    <div class="bearing">PANEL ADMIN</div>
  </header>

  <!-- ===== LOGIN ===== -->
  <section id="loginScreen">
    <div class="admin-card">
      <h1>Acceso del administrador</h1>
      <p class="cover-sub">Iniciá sesión con la cuenta que diste de alta en Firebase Authentication.</p>
      <form id="loginForm" style="margin-top:26px;display:flex;flex-direction:column;gap:16px;">
        <div class="admin-field">
          <label for="emailInput">Email</label>
          <input id="emailInput" type="email" required autocomplete="username">
        </div>
        <div class="admin-field">
          <label for="passInput">Contraseña</label>
          <input id="passInput" type="password" required autocomplete="current-password">
        </div>
        <p id="loginError" class="admin-error" hidden></p>
        <button class="btn" type="submit">Iniciar sesión</button>
      </form>
    </div>
  </section>

  <!-- ===== DASHBOARD ===== -->
  <section id="dashScreen" hidden>
    <div class="admin-head-row">
      <div>
        <p class="eyebrow">Panel del administrador</p>
        <h2 style="font-size:1.6rem;">Resultados registrados</h2>
      </div>
      <button class="btn btn-ghost" id="logoutBtn">Cerrar sesión</button>
    </div>

    <div class="admin-toolbar">
      <span id="countLabel" class="mono"></span>
      <button class="link-btn" id="refreshBtn">↻ Actualizar</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Fecha</th><th>Nombre</th><th>1º área</th><th>2º área</th><th>3º área</th><th></th></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
    <p id="emptyState" class="footnote" hidden>Todavía no hay resultados guardados.</p>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
